version: 2
note: SCP-9191's architecture over the Site kit's measurements. Originally generated, but that generator no longer exists anywhere in the tree — hand-maintained now. tests/site_descriptors.rs checks the heights these patches produce.
exclude: []
# `face_bands` used to live here and no longer does: the lattice is a property of the PROJECT,
# not of one kit's policy, because two kits disagreeing about how finely a face is read have
# faces that cannot be compared. It is declared once in `assets/grimoire/kits.ron` under
# `lattice:`, at the same value this file carried (1).
patches:
- match: !Id site/wall
  because: this facility builds Wall to 2.40 m; the mesh is authored at 2.40 m
  patch:
    id: ''
    mesh: null
    align:
      scale: null
      stretch_y: 1.0
      y_offset: null
      pivot: null
      rotate: null
      front: null
    extent:
      footprint: null
      height: null
    mount: null
    clearance: []
    offers:
      surfaces: []
      faces: []
      sockets: []
    kind: []
    effects: []
    look: []
    placement:
      rooms: []
      group: null
    subgrid: null
    note: null
