# bevy_grimoire: world-building from an authored example, as a set of crates for Bevy 0.20.
# Extracted from foundation_vs_slop (history kept) and relicensed MIT OR Apache-2.0.
[workspace]
members = ["crates/*"]
resolver = "3"

# One version per dependency, for the whole workspace. A member that needs different FEATURES
# declares them next to `workspace = true`; a member that needs `default-features = false` declares
# the dependency outright (Cargo ignores a member-level `default-features` on an inherited one).
[workspace.dependencies]
bevy = { version = "0.20.0" }
serde = { version = "1.0.228", features = ["derive"] }
# `float_roundtrip`: an operation's `after` is logged as JSON text and compared, read back, with the map's
# `f32`s widened to `f64`. The default parser can read a 17-digit number back one step off, which made undo
# refuse a turn to 3.9 degrees as an edit outside the log (#196).
serde_json = { version = "1.0", features = ["float_roundtrip"] }
ron = "0.12.2"
# The path to the field a refused file is wrong at (`placements[3].yaw`), which ron names only for a
# missing field (#200). Read only on a refusal, to say where, never to decide.
serde_path_to_error = "0.1"
# **The YAML reader and writer, and the event parser that says where a node stands.** `serde_yaml_ng`
# reads a project file (GD-01, #363, `bevy_grimoire_core/src/yaml.rs`) and follows YAML 1.2, so only
# `true` and `false` are booleans. Its reader resolves an anchor silently, reports a duplicate key with
# no position, and accepts a leading tab, so the text is walked first by `saphyr-parser`, which reports
# every node's path and position: that walk is where each refusal is refused, at its own line and field
# path. Both are pure data crates with no engine in them.
serde_yaml_ng = "0.10"
saphyr-parser = "0.3"
# **The JSON Schema every project file kind publishes** (GD-04, #366): generated from the type, never
# written by hand, so a schema cannot describe a file the type does not read. `schemars` is what the MCP
# server already uses for its tool arguments, and it holds no engine type.
schemars = "1"
rand = "0.10"
rand_chacha = "0.10"
# **The digest a guide's grant is for** (#348, AG-03). A project's `AGENTS.md` is served only when a person
# allowed that exact content, and "exact" is a SHA-256 of the bytes: one changed byte is a different guide
# and asks again. A published construction with published vectors, and the vectors are checked. Already a
# dependency of the editor; here so the engine-free core can hold the same type without a second digest.
sha2 = "0.10"
# **The terminal's engine, and the only new crate the in-editor terminal costs.** A pure-Rust VTE
# parser plus the grid that holds what the parser wrote — the part of a terminal that is hard, taken
# whole rather than re-derived. Its `tty` module also owns the PTY (fork, `setsid`, `TIOCSCTTY`,
# `TIOCSWINSZ`), so there is no second PTY layer beside it: `portable-pty` would be exactly the
# two-paths arrangement `AGENTS.md` forbids, and it is not a dependency here for that reason.
#
# Apache-2.0, which is compatible with this workspace's MIT OR Apache-2.0. `libghostty-vt` is the
# better engine and is rejected on its own project's statement that it is "not yet a stable API and
# has not been released as a standalone, stable library" (ghostty.org, read 2026-11-05) — a decision
# that gets revisited when that sentence goes away, not on a hunch that it might be fine.
#
# Its Unix half is behind `cfg(unix)`; `terminal/pty.rs` refuses on any other target with a reason
# rather than pretending a shell started.
alacritty_terminal = { version = "0.26.0", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }

# Same dev profile as Sanctuary: Bevy runs fast in debug without slowing rebuilds of these crates.
[profile.dev]
opt-level = 1
# **Incremental is off, and the reason is measured, not aesthetic.** This workspace's debug profile
# writes its incremental cache to the shared `CARGO_TARGET_DIR`, and on this machine that cache
# reached 6–18 GB on three separate occasions in one session and filled a 461 GB disk to 100%, at
# which point the linker fails with `write() failed, errno=28` and the failure looks like a broken
# test rather than a full disk. `opt-level = 1` already rebuilds this code quickly; the cache was
# buying a little more speed for a lot of disk, and the trade is wrong here.
incremental = false

[profile.dev.package."*"]
opt-level = 3

# **The workspace's own test binaries are stripped of symbols.** `bevy_cauldron` has ~90 integration
# tests, each linking a full Bevy app into its own ~250 MB executable; `strip -x` takes one from 252 MB
# to 137 MB, ~45% of the ~22 GB they occupy in the shared target dir. Only this package was overridden
# at first, so every *other* member kept its debuginfo: measured 2026-11-02 on big, a `bevy_grimoire`,
# `bevy_devshot` or `bevy_grimoire_anim` test binary was **2.0 GB**, and `strip -x` takes each to about
# 65 MB (97% smaller). With 50 such binaries over 1 GB in `target/` (134 GB total), and an aborted link
# leaving a 2 GB `.tmp` behind, that is the difference between a build that fits beside its siblings and
# one that fills the disk.
#
# The cost is that a panic's backtrace shows no function names (the panic message and line are
# unaffected). A dependency keeps the build it already has; these are this workspace's own packages.
[profile.dev.package.bevy_cauldron]
strip = "symbols"

[profile.dev.package.bevy_grimoire]
strip = "symbols"

[profile.dev.package.bevy_devshot]
strip = "symbols"

[profile.dev.package.bevy_grimoire_anim]
strip = "symbols"

[profile.dev.package.bevy_oracle]
strip = "symbols"

# One isomesh for the whole build: `bevy_elements`' `isomesh` feature asks the registry for 0.0.11, and a
# second copy would make our `Sdf` impls a different trait from the one its `SnowyField` wants (#101).
[patch.crates-io]
isomesh = { git = "https://github.com/bevy-coven/isomesh", rev = "d3dc6c0fb6b43b899e534643f51f76a856d2d9ee" }
