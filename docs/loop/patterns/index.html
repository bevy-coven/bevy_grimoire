<!DOCTYPE html>
<meta charset="utf-8">
<title>Cauldron capture history</title>
<style>
:root{--bg:#15171a;--fg:#e6e6e6;--muted:#9aa0a6;--line:#2c3035;--c1:#5b9dd9;--c2:#d98b5b;--c3:#7fb069;--c4:#c25b7a}
*{box-sizing:border-box}
body{margin:0;padding:24px;background:var(--bg);color:var(--fg);font:14px/1.5 ui-sans-serif,system-ui,sans-serif}
h1{font-size:20px;margin:0 0 4px}h2{font-size:15px;margin:28px 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sub{color:var(--muted);margin:0 0 8px}
table{border-collapse:collapse;font-size:13px}
th,td{padding:3px 10px 3px 0;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:500}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.bar{height:14px;background:var(--c1);display:inline-block;vertical-align:middle;border-radius:2px}
.bar.fix{background:var(--c3)}.bar.blk{background:var(--c2)}
.grid td{text-align:center;font-variant-numeric:tabular-nums}
.grid td.z{color:#3a3f45}
.chip{display:inline-block;padding:1px 7px;border-radius:9px;font-size:11px;background:var(--line)}
ul{margin:6px 0;padding-left:20px}
</style>

<script>
const raw = document.getElementById("cases").textContent.trim().split("\n").filter(Boolean).map(JSON.parse);
// correction lines replace the field they name
for (const c of raw) if (c.correct) {
  const t = raw.find(x => !x.correct && x.stem === c.correct);
  if (t) t[c.field] = c.value;
}
const cases = raw.filter(c => !c.correct);
const $ = id => document.getElementById(id);
$("meta").textContent = `${cases.length} cases \u00b7 ` +
  ["fixed","blocked","unreproduced","declined"].map(o =>
    `${cases.filter(c=>c.outcome===o).length} ${o}`).join(" \u00b7 ");

// 1. per week by outcome
const week = {};
for (const c of cases) {
  const d = new Date(c.closed_at);
  const mon = new Date(d); mon.setUTCDate(d.getUTCDate() - ((d.getUTCDay()+6)%7));
  const k = mon.toISOString().slice(0,10);
  week[k] = week[k] || {};
  week[k][c.outcome] = (week[k][c.outcome]||0)+1;
}
const outcomes = ["fixed","blocked","unreproduced","declined"];
let wh = "<tr><th>week of</th>" + outcomes.map(o=>`<th>${o}</th>`).join("") + "<th>total</th></tr>";
for (const k of Object.keys(week).sort()) {
  const r = week[k], tot = outcomes.reduce((a,o)=>a+(r[o]||0),0);
  wh += `<tr><td>${k}</td>` + outcomes.map((o,i)=>
    `<td class="n"><span class="bar ${o==="fixed"?"fix":o==="blocked"?"blk":""}" style="width:${
      (r[o]||0)/tot*90}px"></span> ${r[o]||0}</td>`).join("") + `<td class="n">${tot}</td></tr>`;
}
$("weekly").innerHTML = wh;

// 2. symptom x cause grid
const syms = [...new Set(cases.map(c=>c.symptom))].sort();
const causes = [...new Set(cases.map(c=>c.cause).filter(Boolean))].sort();
const cell = (s,k) => cases.filter(c=>c.symptom===s&&c.cause===k);
let gh = "<tr><th></th>" + causes.map(k=>`<th>${k}</th>`).join("") + "</tr>";
for (const s of syms) {
  gh += `<tr><th style="text-align:left">${s}</th>`;
  for (const k of causes) {
    const n = cell(s,k).length;
    const max = Math.max(1,...syms.flatMap(x=>causes.map(y=>cell(x,y).length)));
    const a = n/max*0.85;
    gh += `<td class="${n?"":"z"}" style="${n?`background:rgba(91,157,217,${a})`:""}">${n||"\u00b7"}</td>`;
  }
  gh += "</tr>";
}
$("grid").innerHTML = gh;

// 3. hotspots
const files = {};
for (const c of cases) if (c.outcome==="fixed") for (const f of c.files) files[f]=(files[f]||0)+1;
const hot = Object.entries(files).filter(([,n])=>n>=2).sort((a,b)=>b[1]-a[1]);
$("hot").innerHTML = hot.length
  ? "<tr><th>file</th><th>fixed cases</th><th>stems</th></tr>" + hot.map(([f,n])=>
      `<tr><td><code>${f}</code></td><td class="n">${n}</td><td>${
        cases.filter(c=>c.files.includes(f)).map(c=>c.stem).join(", ")}</td></tr>`).join("")
  : "<tr><td>none yet</td></tr>";

// 4. config skew: cases vs all ledger captures is only possible with case data here;
//    report the case shares and label the bias.
const skew = [];
for (const f of ["scale_factor","ui_scale","window","backend"]) {
  const m = {};
  for (const c of cases) { const v = String(c.platform[f]); m[v]=(m[v]||0)+1; }
  for (const [v,n] of Object.entries(m))
    skew.push(`<tr><td>${f}</td><td><code>${v}</code></td><td class="n">${n}</td>
      <td class="n">${(n/cases.length*100).toFixed(0)}%</td></tr>`);
}
$("skew").innerHTML = "<tr><th>field</th><th>value</th><th>cases</th><th>share</th></tr>" +
  skew.join("") + `<tr><td colspan="4" style="color:var(--muted)">
  All captures in the ledger come from one host at one scale, so these shares describe what the loop has
  looked at, not what breeds defects.</td></tr>`;

// 5. regressions
const regs = cases.filter(c=>c.regression_of);
const twice = Object.entries(cases.reduce((a,c)=>(a[c.stem]=(a[c.stem]||0)+1,a),{})).filter(([,n])=>n>1);
$("regs").innerHTML = (regs.length?regs.map(c=>`<li>${c.stem} is a regression of ${c.regression_of}</li>`).join(""):"<li>none recorded</li>")
  + (twice.length?twice.map(([s,n])=>`<li>${s} closed ${n} times</li>`).join(""):"<li>no stem closed twice</li>");

// 6. other: values
const oth = {};
for (const c of cases) for (const f of ["symptom","cause","oracle"])
  if (String(c[f]||"").startsWith("other:")) { oth[c[f]]=oth[c[f]]||[]; oth[c[f]].push(c.stem); }
$("oth").innerHTML = Object.keys(oth).length
  ? Object.entries(oth).map(([v,s])=>`<li><code>${v}</code> <span class="chip">${s.length}</span> ${s.join(", ")}</li>`).join("")
  : "<li>none</li>";
</script>
