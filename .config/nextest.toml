# nextest's own settings, read by `cargo nextest run` and by the push gate (tools/loop/hooks/pre-push).

# **Wall-clock tests run alone.** A test that asserts a frame costs under N milliseconds measures the host as much as
# the code: nextest starts one test per core, so on the push gate a budget test shares the machine with 23 other Bevy
# apps (and with CI jobs and agent builds beside the gate), and it failed 9 of the 26 refused pushes in the 2026-11-09..11
# fleet run (docs/loop/iterations/2026-11-11-fleet-timing.md). `threads-required = "num-cpus"` makes nextest give such a
# test every slot, so nothing else of this run is executing while it measures. Nothing is loosened: each budget is the
# number its test asserts. Add a test here when it asserts elapsed time against a budget or waits on the wall clock.
[[profile.default.overrides]]
filter = 'test(/the_uis_budget_is_two_milliseconds_a_frame|the_ui_frame_covers_a_change_and_the_input_path|the_frame_a_change_lands_on_stays_inside_two_milliseconds|scrolling_five_thousand_lines_stays_inside_the_ui_frame_budget|a_slow_load_shows_a_spinner_then_progress_then_the_editor/)'
threads-required = "num-cpus"
