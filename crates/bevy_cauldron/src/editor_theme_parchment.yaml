# **Parchment, as the editor draws it** (#428): the colour half of a skin, the cream and brown of gooey's
# `GooeySkin::parchment()` made into a whole ladder and the editor's own tones. Read by `ui::skin_for`, which
# lays it over `editor_skin.yaml`'s sizes, so a theme never moves a layout. `surface`, `text` and `accent`
# are the preset's own; `surface_raised` (lighter than the panel, so a row stands off it), `text_muted`,
# `danger` and the tones are set so every ink the editor draws reads on every ground it is drawn on
# (`tests/the_theme_moves_every_colour.rs`).
