# **High contrast, as the editor draws it** (#428): the colour half of a skin, gooey's
# `GooeySkin::high_contrast()` (opaque black, white text, amber accent) with the editor's whole eight-step
# ladder and its own tones, held to 7:1 for body text. Read by `ui::skin_for`, which lays it over
# `editor_skin.yaml`'s sizes, so a theme never moves a layout. No shadows: a high-contrast look is edges.
