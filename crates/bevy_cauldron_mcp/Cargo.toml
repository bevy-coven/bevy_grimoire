[package]
name = "bevy_cauldron_mcp"
version = "0.1.0"
edition = "2024"
description = "An MCP server for the bevy_grimoire world editor: typed operations over stdio, and a BRP client for the running editor."
license = "MIT OR Apache-2.0"
repository = "https://github.com/bevy-coven/bevy_grimoire"
readme = "README.md"
keywords = ["mcp", "gamedev", "level-design", "bevy"]
categories = ["game-development", "development-tools"]
rust-version = "1.88"
# Not published (E-006, #128) while `bevy_oracle` is `publish = false`; it runs from this repo.
publish = false

[lib]
# **A library as well as a binary**, so the tests can read the tool declarations rather than
# parsing the binary's source. A test that parses source text is a test of the source text.
name = "bevy_cauldron_mcp"
path = "src/lib.rs"

[[bin]]
name = "bevy_cauldron_mcp"
path = "src/main.rs"

[dependencies]
# The schema, engine-free: the server reads project files with the editor's own types rather than a
# second copy of them. `bevy_grimoire_core/tests/engine_free.rs` keeps it free of any bevy dependency.
bevy_grimoire_core = { path = "../bevy_grimoire_core" }
# The crop the editor and this server share, so a snip and an `grimoire_snip` cut the same way.
bevy_grimoire_snip = { path = "../bevy_grimoire_snip" }
# Typed questions to a decision model, and the checks built on them. Authoring time only.
bevy_oracle = { path = "../bevy_oracle" }
# **The official Rust SDK for the Model Context Protocol.**
#
# **Pinned exactly, and the newest version in the local registry.** Its API differs from 1.x, so a
# 1.x example would not compile against it, and the pin is what says which API this was written
# against.
#
# **`transport-io` is what the stdio transport is behind** (`rmcp-3.3.0/src/transport/io.rs:4`),
# and it is not in the default feature set — `server` alone does not enable it. The `macros`
# feature is what gives the `#[tool]` and `#[tool_router]` attributes.
rmcp = { version = "=3.3.0", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
# **The `json` feature, and it is not optional.** BRP is JSON-RPC 2.0, and `send_json` is the
# only ureq call that serialises a request body for us. Without it the client would hand-roll
# the body and the `Content-Type`, and a JSON-RPC server that gets a wrong content type answers
# with a parse error rather than with the refusal it meant to send.
ureq = { version = "3", features = ["json"] }
# **Base64, for the frames the editor writes to disk.**
#
# The BRP screenshot path hands back a base64 PNG, which passes straight through; a frame read
# back from a file does not, and the MCP image content wants base64. `base64` is what encodes it,
# and it is a dependency of `rmcp` already -- so this is the same crate, named directly.
base64 = "0.22"

[dev-dependencies]
# **The MCP client, for the integration test.** The brief asks for a test that calls a tool "as an
# outside agent would" — through a client, over the protocol, not by calling the function.
# **The MCP client, for the integration test.** The brief asks for a test that calls a tool "as an
# outside agent would" — through a client, over the protocol, not by calling the function.
