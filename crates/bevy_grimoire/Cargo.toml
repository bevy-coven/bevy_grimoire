[package]
name = "bevy_grimoire"
version = "0.4.8"
edition = "2024"
rust-version = "1.97.1"
description = "The runtime half of grimoire: load a library and a map, and put it in a Bevy world."
# Relicensed MIT OR Apache-2.0 on extraction from foundation_vs_slop (owner decision, Sanctuary decision 0087).
license = "MIT OR Apache-2.0"
repository = "https://github.com/bevy-coven/bevy_grimoire"

# **The only crate in the set that knows what a renderer is on purpose.** `bevy_grimoire_core` is the schema
# and the solvers and has no engine (`crates/bevy_grimoire_core/tests/engine_free.rs` fails the build if that
# stops being true); this turns its data into entities. The game and `bevy_cauldron` both depend on
# THIS rather than each growing a spawner, so a map looks the same in the editor and in play.
[dependencies]
bevy_grimoire_core = { path = "../bevy_grimoire_core", version = "0.10.0" }
bevy = { workspace = true, features = ["jpeg", "serialize", "reflect_documentation"] }
# **The schema export, and nothing else of `bevy_remote`.** `registry.schema` is the only function that can say
# what a game's own components are, so `game.schema.json` cannot be written without it — and a game that ships
# must not gain a listening socket for one file written at start. `bevy_internal` takes this crate with
# `default-features = false` (its `http` feature is off), so this declares the same dependency and gets the
# pure export; `RemotePlugin` is never added. A game cannot have two versions of one crate in its graph, so
# this is the same `bevy_remote` a game with a debugger already links (#366).
bevy_remote = { version = "0.20.0", default-features = false, features = ["bevy_asset", "bevy_render"] }
# The registry's answer is a JSON value this writes as text, so this is the module's own dependency and not a
# test's.
serde_json.workspace = true
# **The behaviours' own fields, read from a file** (GD-07, #369). A component a file may set needs
# `#[reflect(Deserialize)]`, which is a `serde::Deserialize` impl; GD-05's reader then builds it through
# `ReflectDeserialize`. Not a test dependency any more: the crate itself derives them now.
serde.workspace = true
