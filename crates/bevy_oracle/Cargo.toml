[package]
name = "bevy_oracle"
version = "0.1.0"
edition = "2024"
description = "Typed questions to a decision model (Clef): yes/no, choice and score questions about a state and up to four images, answered with a probability for every option. Authoring time only; no Bevy."
license = "MIT OR Apache-2.0"
repository = "https://github.com/bevy-coven/bevy_grimoire"
keywords = ["decision", "clef", "vlm", "calibration"]
publish = false

# Engine-free: no `bevy*` dependency, and no game links this crate.
[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "3", features = ["json"] }
ron.workspace = true
