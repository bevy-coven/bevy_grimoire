name: Release Cauldron (macOS)
# **The downloadable app** (`tools/release/macos/build_app.sh`): a tag `bevy_cauldron-vX.Y.Z` builds Cauldron.app
# with every family crate, signs it with the Developer ID, notarizes and staples it, and publishes the DMG, the
# update zip and SHA256SUMS as a GitHub Release, which is what the in-app updater reads (`src/update.rs`).
# **Runs on mac_air, a self-hosted runner** (owner, 2026-11-04): a hosted macOS job waited minutes for a machine and
# started cold. mac_air is the Mac the owner compiles on; its runner (`~/actions-runner-bevy_grimoire`, a launchd
# agent) keeps the cargo target between runs, so a release rebuilds only what changed. mac_air asleep or off means
# the job waits in the queue: there is no hosted fallback. Fork pull requests need approval before any job runs.
on:
  push:
    tags: ["bevy_cauldron-v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub Release from this run"
        type: boolean
        default: false
      sign:
        description: "Signature: the Developer ID (notarized) or ad-hoc (proves the build only)"
        type: choice
        options: [developer-id, adhoc]
        default: developer-id
env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_DEBUG: 0
jobs:
  app:
    runs-on: [self-hosted, macOS, ARM64, mac_air]
    timeout-minutes: 150
    permissions:
      contents: write
    env:
      DEVELOPER_ID: ${{ github.event_name == 'push' || inputs.sign == 'developer-id' }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      # Outside the checkout, which `actions/checkout` cleans: this is what makes the next release incremental.
      - name: Keep the cargo target between runs
        run: echo "CARGO_TARGET_DIR=$HOME/actions-runner-bevy_grimoire/cargo-target" >> "$GITHUB_ENV"
      - name: Version
        id: version
        run: |
          V=$(cargo metadata --format-version 1 --no-deps | python3 -c 'import json, sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "bevy_cauldron"))')
          echo "v=$V" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_NAME" != "bevy_cauldron-v$V" ]; then
            echo "tag $GITHUB_REF_NAME does not match bevy_cauldron $V" >&2
            exit 1
          fi
      - name: Import the Developer ID certificate and the notary key
        if: env.DEVELOPER_ID == 'true'
        env:
          P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        run: |
          for s in P12_BASE64 P12_PASSWORD TEAM_ID P8_BASE64; do
            [ -n "${!s}" ] || { echo "secret for $s is not set: see the release plan's prerequisites" >&2; exit 1; }
          done
          KC="$RUNNER_TEMP/build.keychain"
          # A self-hosted runner is a person's Mac: remember their keychain search list, so the cleanup puts it back.
          security list-keychains -d user | tr -d '"' > "$RUNNER_TEMP/keychains-before"
          KC_PASSWORD=$(openssl rand -hex 24)
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PASSWORD" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASSWORD" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASSWORD" "$KC"
          security list-keychains -d user -s "$KC" $(cat "$RUNNER_TEMP/keychains-before")
          rm "$RUNNER_TEMP/cert.p12"
          IDENTITY=$(security find-identity -v -p codesigning "$KC" | grep -m1 'Developer ID Application' | sed -E 's/.*"(.*)"/\1/')
          [ -n "$IDENTITY" ] || { echo "no Developer ID Application identity in the certificate" >&2; exit 1; }
          case "$IDENTITY" in
            *"($TEAM_ID)") ;;
            *) echo "the identity's team is not APPLE_TEAM_ID: $IDENTITY" >&2; exit 1 ;;
          esac
          echo "$P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "CAULDRON_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "CAULDRON_NOTARIZE=1" >> "$GITHUB_ENV"
          echo "APPLE_NOTARY_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          echo "CAULDRON_KEYCHAIN=$KC" >> "$GITHUB_ENV"
      - name: Build, sign, notarize
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: tools/release/macos/build_app.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cauldron-macos
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS
      - name: Publish the release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.version.outputs.v }}
        run: |
          # An ad-hoc DMG is refused by Gatekeeper as "damaged" on every other Mac (audit 2026-11-04, #285):
          # it stays an artifact of this run, for testing, and never becomes a release.
          if [ "$DEVELOPER_ID" != 'true' ]; then
            echo "an ad-hoc build is never published: it does not open on another Mac" >&2
            exit 1
          fi
          gh release create "bevy_cauldron-v$V" dist/Cauldron-*.dmg dist/Cauldron-*.zip dist/SHA256SUMS \
            --target "$GITHUB_SHA" --title "Cauldron $V" --generate-notes
      - name: Remove the signing keychain and the notary key
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/keychains-before" ]; then
            security list-keychains -d user -s $(cat "$RUNNER_TEMP/keychains-before")
          fi
          if [ -n "${CAULDRON_KEYCHAIN:-}" ]; then
            security delete-keychain "$CAULDRON_KEYCHAIN"
          fi
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/keychains-before"
