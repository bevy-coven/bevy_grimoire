name: CI
# **Once a day, not on every push** (owner, 2026-10-29). Several loop workers push to `main` many times an hour,
# and a run per push queued behind itself and slowed every iteration; each pass already builds, lints and tests
# locally before it pushes. A red daily run is a bug the loops take first (`build-loop.md`, "Parallel workers").
on:
  schedule:
    - cron: "0 9 * * *"   # 09:00 UTC, 04:00 in Texas
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
jobs:
  test:
    name: test (workspace)
    # **A self-hosted runner** (owner, 2026-11-04). Eight sibling repos already run here, the registry
    # allocates `bevy-coven/bevy_grimoire 1`, and big carries the toolchain, `cargo-nextest`, `Xvfb` and
    # `xvfb-run` the workspace test needs. big is shared and runs systemd-oomd, which has SIGKILLed a CI
    # container under memory pressure: a job lost that way is rerun, not diagnosed.
    runs-on: [self-hosted, big]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - name: workspace tests (nextest)
        run: xvfb-run -a cargo nextest run --workspace --no-fail-fast 2>&1 | tee test-output.txt
      - name: doctests (nextest does not run them)
        run: cargo test --workspace --doc 2>&1 | tee doc-output.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-output
          path: |
            test-output.txt
            doc-output.txt
