name: CI
# **Once a day, not on every push** (owner, 2026-10-29). Several loop workers push to `main` many times an hour,
# and a run per push queued behind itself and slowed every iteration; each pass already builds, lints and tests
# locally before it pushes. A red daily run is a bug the loops take first (`build-loop.md`, "Parallel workers").
on:
  schedule:
    - cron: "0 9 * * *"   # 09:00 UTC, 04:00 in Texas
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
jobs:
  test:
    name: test (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Bevy Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libx11-dev mesa-vulkan-drivers xvfb pkg-config clang
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: workspace tests (nextest)
        run: xvfb-run -a cargo nextest run --workspace --no-fail-fast 2>&1 | tee test-output.txt
      - name: doctests (nextest does not run them)
        run: cargo test --workspace --doc 2>&1 | tee doc-output.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-output
          path: |
            test-output.txt
            doc-output.txt
